name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - run: make all
      - name: Committed docs and pages must equal a fresh regeneration
        run: git diff --exit-code -- docs STRATEGY_MEMO.md LOOM_SCRIPT.md DATA_DICTIONARY.md
      - run: make test
